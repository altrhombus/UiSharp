name: Release

# Runs on every version tag push (v1.0.0, v1.1.0-rc1, etc.).
# Can also be triggered manually via Actions → Run workflow to verify the
# build without creating a release (the publish step is skipped on non-tag runs).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

jobs:

  # ── 1. Tests ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: UiSharp.Core tests
        run: dotnet test src/UiSharp.Core.Tests -c Release

      - name: UiSharp.Editing tests
        run: dotnet test src/UiSharp.Editing.Tests -c Release

      - name: UiSharp.Windows tests
        run: dotnet test src/UiSharp.Windows.Tests -c Release

      - name: UiSharp.Diagnostics tests
        run: dotnet test src/UiSharp.Diagnostics.Tests -c Release

  # ── 2. Build & release ──────────────────────────────────────────────────────
  release:
    name: Build & Release
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        # fetch-depth 0 so git rev-parse works inside the gUISharp build target
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── UiSharp runtime — single self-contained EXE for WinPE ──────────────────

      - name: Publish UiSharp (win-x64)
        run: >
          dotnet publish src/UiSharp/UiSharp.csproj
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:TrimMode=partial
          -c Release

      - name: Publish UiSharp (win-x86)
        run: >
          dotnet publish src/UiSharp/UiSharp.csproj
          -r win-x86 --self-contained true
          -p:PublishSingleFile=true -p:TrimMode=partial
          -c Release

      - name: Stage UiSharp binaries
        shell: pwsh
        run: |
          Copy-Item src/UiSharp/bin/Release/net10.0-windows/win-x64/publish/UiSharp.exe UiSharp-x64.exe
          Copy-Item src/UiSharp/bin/Release/net10.0-windows/win-x86/publish/UiSharp.exe UiSharp-x86.exe

      # ── Self-test the published binary ──────────────────────────────────────
      #
      # The unit tests run against ordinary assemblies; this runs the artefact
      # that ships. Single-file publishing with partial trimming can drop the
      # types the action registry finds by reflection, and nothing about that
      # failure is visible until a configuration quietly stops doing anything.
      # A runner is not WinPE and not inside a task sequence, so the
      # task-sequence checks only exercise the local fallback here — the point
      # is the binary, not the environment.

      - name: Self-test the published binary (win-x64)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./UiSharp-x64.exe -Wait -PassThru `
                 -ArgumentList '/selftest', '/selftestreport:selftest-x64.txt'
          if (Test-Path selftest-x64.txt) { Get-Content selftest-x64.txt }
          if ($p.ExitCode -ne 0) {
            throw "The published binary failed its self-test (exit code $($p.ExitCode))."
          }

      # ── gUISharp editor — ZIP of the full output folder ─────────────────────

      - name: Build gUISharp (x64)
        run: dotnet build tools/gUISharp/gUISharp.csproj -c Release -p:Platform=x64

      - name: Build gUISharp (arm64)
        run: dotnet build tools/gUISharp/gUISharp.csproj -c Release -p:Platform=arm64

      - name: Package gUISharp (x64)
        shell: pwsh
        run: >
          Compress-Archive
          -Path   "tools/gUISharp/bin/x64/Release/net10.0-windows10.0.22621.0/*"
          -DestinationPath "gUISharp-x64.zip"

      - name: Package gUISharp (arm64)
        shell: pwsh
        run: >
          Compress-Archive
          -Path   "tools/gUISharp/bin/arm64/Release/net10.0-windows10.0.22621.0/*"
          -DestinationPath "gUISharp-arm64.zip"

      # ── GitHub Release ───────────────────────────────────────────────────────
      # Skipped on workflow_dispatch (no tag → no release).
      # Tags containing '-' (e.g. v1.1.0-rc1) are auto-marked as pre-release.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            UiSharp-x64.exe
            UiSharp-x86.exe
            selftest-x64.txt
            gUISharp-x64.zip
            gUISharp-arm64.zip
